name: Commit Messages

on:
  # YAGA reads the event's base policy and PR messages as data. PR code is
  # fetched but never checked out or executed with the target-repository token.
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-only execution
    types: [opened, ready_for_review, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commit-messages-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify PR commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_ref="refs/remotes/pull/${PR_NUMBER}/head"
          git fetch --no-tags --force origin \
            "refs/pull/${PR_NUMBER}/head:${pr_ref}"
          test "$(git rev-parse "$pr_ref")" = "$PR_HEAD_SHA"
          git cat-file -e "${PR_BASE_SHA}^{commit}"

      - name: Validate PR title and commits with YAGA
        uses: dariuszpanas/yaga/actions/commit-check@f61bbfa878447157239bb92ff67977bd64400afd # v0.2.0
        with:
          trusted-config: .yaga.toml
